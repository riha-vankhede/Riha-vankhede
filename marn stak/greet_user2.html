<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f9fa;
    }
    h1 { margin-top: 20px; }
    #users {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px;
    }
    .user-card {
      padding: 15px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .user-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>User Directory</h1>
  <button id="refreshBtn">Refresh Users</button>
  <div id="users"></div>

  <script>
    const refreshBtn = document.getElementById("refreshBtn");
    const usersDiv = document.getElementById("users");

    async function loadUsers() {
      try {
        const res = await fetch("https://randomuser.me/api/?results=10");
        const data = await res.json();
        usersDiv.innerHTML = ""; // clear old users

        data.results.forEach(user => {
          const card = document.createElement("div");
          card.className = "user-card";
          card.innerHTML = `
            <img src="${user.picture.large}" alt="User Photo">
            <h3>${user.name.first} ${user.name.last}</h3>
            <p>${user.email}</p>
          `;
          usersDiv.appendChild(card);
        });
      } catch (error) {
        usersDiv.innerHTML = `<p style="color:red;">Error fetching users</p>`;
      }
    }

    // Load users first time
    loadUsers();

    // Refresh button click
    refreshBtn.addEventListener("click", loadUsers);
  </script>
</body>
</html>
