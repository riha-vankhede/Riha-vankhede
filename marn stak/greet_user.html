<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random User Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f9fa;
    }
    .user-card {
      margin: 40px auto;
      padding: 20px;
      width: 250px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .user-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>Random User Generator</h1>
  <div class="user-card" id="userCard">
    <p>Click the button to load user data.</p>
  </div>
  <button id="loadBtn">Fetch Random User</button>

  <script>
    const btn = document.getElementById("loadBtn");
    const userCard = document.getElementById("userCard");

    btn.addEventListener("click", async () => {
      try {
        const res = await fetch("https://randomuser.me/api/");
        const data = await res.json();
        const user = data.results[0];

        userCard.innerHTML = `
          <img src="${user.picture.large}" alt="User Photo">
          <h3>${user.name.first} ${user.name.last}</h3>
          <p>${user.email}</p>
        `;
      } catch (error) {
        userCard.innerHTML = `<p style="color:red;">Error fetching data</p>`;
      }
    });
  </script>
</body>
</html>
